name: Build Pedigro Standalone Binaries (Windows & Android)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: Windows Desktop Installer (Tauri v2 + WebView2)
  # ========================================================
  build-windows:
    name: Build Windows Desktop (.exe / .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Verify Packaging Configurations
        run: npm run verify:packaging

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Pedigro v__VERSION__'
          releaseBody: 'Rilis resmi biner Pedigro - Sistem Pemuliaan & Uji Varietas Tanaman.'
          releaseDraft: false
          prerelease: false

  # ========================================================
  # JOB 2: Android Mobile Package (Capacitor + Gradle APK)
  # ========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pedigro-Android-Release
          path: android/app/build/outputs/apk/release/*.apk
