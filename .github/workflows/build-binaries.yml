name: Pedigro Release & Verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # JOB 1: Verification & Portable Release Package
  # ========================================================
  release-portable:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Packaging Configurations
        run: node scripts/verify-packaging.js

      - name: Create Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pedigro ${{ github.ref_name }}
          body: |
            ## Pedigro ${{ github.ref_name }} — Official Standalone Release
            
            Platform Pemuliaan & Uji Varietas Tanaman (BrAPI v2.1 Aligned) — 100% Offline-First & Standalone.
            
            ### Cara Menjalankan di Windows:
            1. Unduh berkas `Pedigro-v1.0.0-Portable-Windows.zip` di bawah.
            2. Ekstrak zip ke folder komputer Anda.
            3. Klik dua kali berkas `Pedigro-Launcher.bat` untuk membuka aplikasi dalam mode jendela mandiri (Native App Window).
            
            ### Ringkasan Fitur:
            - Arsitektur mandiri (Zero-Dependency) tanpa instalasi Node.js/Internet.
            - Visualisasi Pohon Silsilah (Pedigree Tree) & Skema Data BrAPI v2.1.
            - Validasi & Rekomendasi Seleksi Varietas (UU PVT No. 29/2000).
            - Kompresi Cerdas Foto Makro Botani (Full HD 1920px, ~300 KB).
            - Backup Kriptografis SHA-256 dengan Deteksi Integritas Data.
            - Terintegrasi Pemindai Kamera QR & Penanda Koordinat GPS.
          files: |
            build/Pedigro-v1.0.0-Portable-Windows.zip
          draft: false
          prerelease: false

